# CI quality gate.
#
# Runs the pre-push gate from CLAUDE.md (npx tsc --noEmit && npm test &&
# npm run lint && npm run lint:tokens) on every pull request and on pushes to
# main. main auto-deploys to Vercel, so this is the last line of defence before
# a type error, failing unit test, or lint violation ships.
#
# No real database or secret is required. npm test is vitest unit tests (offline)
# and prisma generate only needs a syntactically valid connection string, not a
# reachable server, so harmless placeholders are set at the job level below.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Type-check, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy connection strings: prisma generate (via postinstall and the
      # explicit step) reads these but does not connect. Not real credentials.
      POSTGRES_PRISMA_URL: postgresql://user:pass@localhost:5432/db
      POSTGRES_URL_NON_POOLING: postgresql://user:pass@localhost:5432/db
      # Dummy secret: src/lib/auth.ts throws at import time if this is unset
      # (a real fail-fast check for prod). Any non-empty string satisfies it
      # for the offline unit-test/type-check run here; not a real credential.
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Lint design tokens
        run: npm run lint:tokens

  # The prize desk decides who PEBL posts a real book to, and its logic is a
  # groupBy/join pipeline plus a write, neither of which a mocked Prisma
  # proves anything about. This job stands up a throwaway Postgres, pushes the
  # schema (which also proves the schema still applies cleanly from scratch),
  # and runs the tests that are skipped in the offline job above.
  integration:
    name: Integration (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishspotter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/fishspotter_test
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/fishspotter_test
      PRIZE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fishspotter_test
      METRICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fishspotter_test
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Push schema to the throwaway database
        run: npx prisma db push

      - name: Integration tests
        # --no-file-parallelism: both suites TRUNCATE overlapping tables in
        # beforeEach against the SAME throwaway database, so running the two
        # files in separate worker threads (vitest's default) races, one
        # file's truncate can fire mid-test in the other, surfacing as a
        # foreign-key violation. Sequential is a few seconds slower and
        # correct; parallel across files was never actually safe once a
        # second integration suite existed.
        run: npx vitest run --no-file-parallelism --testNamePattern="" src/lib/prize-desk.integration.test.ts src/lib/metrics/roundup.integration.test.ts
