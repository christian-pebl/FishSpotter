# ONE-SHOT: apply the /admin/prizes schema change to the production database.
#
# Why this exists: PR #116 added PebblePurchase.fulfilledAt / fulfilledBy and an
# index on itemId, but `prisma db push` was never run against prod, so
# /admin/prizes 500s. The change is additive (two NULLable columns + one index)
# and was verified lossless against a replica of prod's pre-change schema.
#
# Why it triggers on push to its own branch: the operator could not reach the
# Actions "Run workflow" button, and this file deliberately lives ONLY on
# ops/db-push-prize-desk. It must NEVER be merged to main — a workflow that runs
# `prisma db push` on every push to the default branch is a footgun, because a
# future schema edit that drops a column would apply silently. Delete the branch
# once this has run.
#
# Read-only afterwards: verification prints column/index names and row COUNTS
# only. No spotter emails or other PII are ever written to the run log.

name: One-shot prod schema push (prize desk)

on:
  push:
    branches: [ops/db-push-prize-desk]

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Schema BEFORE
        run: |
          cat > /tmp/before.mjs <<'EOF'
          import { PrismaClient } from '@prisma/client';
          const p = new PrismaClient();
          const c = await p.$queryRawUnsafe(`select column_name from information_schema.columns where table_name='PebblePurchase' order by column_name`);
          console.log('PebblePurchase columns:', c.map(r=>r.column_name).join(', '));
          const n = await p.$queryRawUnsafe(`select count(*)::int as n from "PebblePurchase"`);
          console.log('PebblePurchase row count:', n[0].n);
          await p.$disconnect();
          EOF
          node /tmp/before.mjs

      - name: Apply schema (prisma db push)
        # Additive only: two NULLable columns + one index. No --accept-data-loss.
        # If Prisma decides this needs data loss, it exits non-zero and we stop.
        run: npx prisma db push --skip-generate

      - name: Schema AFTER + verify the desk can read
        run: |
          cat > /tmp/after.mjs <<'EOF'
          import { PrismaClient } from '@prisma/client';
          const p = new PrismaClient();
          const c = await p.$queryRawUnsafe(`select column_name from information_schema.columns where table_name='PebblePurchase' order by column_name`);
          const names = c.map(r=>r.column_name);
          console.log('PebblePurchase columns:', names.join(', '));
          const i = await p.$queryRawUnsafe(`select indexname from pg_indexes where tablename='PebblePurchase' order by indexname`);
          console.log('indexes:', i.map(r=>r.indexname).join(', '));
          const n = await p.$queryRawUnsafe(`select count(*)::int as n from "PebblePurchase"`);
          console.log('PebblePurchase row count (must match BEFORE):', n[0].n);

          for (const need of ['fulfilledAt','fulfilledBy']) {
            if (!names.includes(need)) { console.error('MISSING COLUMN: '+need); process.exit(1); }
          }
          if (!i.some(r=>r.indexname === 'PebblePurchase_itemId_idx')) {
            console.error('MISSING INDEX: PebblePurchase_itemId_idx'); process.exit(1);
          }

          // The exact read /admin/prizes performs. Counts only - no PII in logs.
          const claims = await p.pebblePurchase.findMany({
            where: { itemId: 'seasearch-guide' },
            select: { userId: true, purchasedAt: true, fulfilledAt: true, fulfilledBy: true },
          });
          console.log('guide claims found:', claims.length,
                      '| already posted:', claims.filter(c=>c.fulfilledAt).length);

          const pts = await p.answer.groupBy({ by: ['userId'], _sum: { points: true } });
          const over = pts.filter(r => (r._sum.points ?? 0) >= 2000);
          console.log('spotters at/over 2,000 Pebbles:', over.length);
          console.log('DESK READ OK');
          await p.$disconnect();
          EOF
          node /tmp/after.mjs

      - name: RLS audit (read-only, fails if any public table is unprotected)
        run: npx tsx scripts/enable-rls.ts --check
